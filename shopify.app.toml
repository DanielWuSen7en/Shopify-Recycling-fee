# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "71db3d3266f6bfe6b2524a544775efeb"
application_url = "https://shopify-recycling-fee-recycling-fee.up.railway.app"
embedded = true
name = "Mattress Recycling Fee"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_cart_transforms,write_cart_transforms,read_publications,write_publications"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://shopify-recycling-fee-recycling-fee.up.railway.app/auth/callback"
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[build]
automatically_update_urls_on_dev = true
